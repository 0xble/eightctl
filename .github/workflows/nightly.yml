name: Nightly

on:
  schedule:
    - cron: '53 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  nightly:
    name: nightly validation
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install lint
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          GOBIN="$RUNNER_TEMP/bin" go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          install-only: true
      - name: Run exact-SHA nightly profile
        run: ./bin/ci nightly "${{ github.sha }}"

  compatibility:
    name: compatibility Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.7', '1.27.1']
    env:
      GOTOOLCHAIN: local
      CI_LANE: compatibility
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Assert checked-out SHA
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go }}
      - name: Run exact-SHA compatibility nightly profile
        run: ./bin/ci nightly "${{ github.sha }}"

  qualification:
    name: qualification
    if: ${{ always() }}
    needs: [nightly, compatibility]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require nightly validation
        env:
          NIGHTLY_RESULT: ${{ needs.nightly.result }}
          COMPATIBILITY_RESULT: ${{ needs.compatibility.result }}
        run: test "$NIGHTLY_RESULT" = success && test "$COMPATIBILITY_RESULT" = success
